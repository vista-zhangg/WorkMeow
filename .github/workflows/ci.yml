name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      # 完整回归包含 Electron Node-mode probes（例如 portable/runtime tests），
      # 因此先安装锁定依赖，再运行测试。
      - name: Full regression tests
        run: npm test
