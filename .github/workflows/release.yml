name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.12'
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME)throw new Error('tag/package version mismatch')"
      - run: npm ci
      - run: npm test
      - name: Verify GIF attribution and assets
        shell: pwsh
        run: |
          $credits = Get-Content assets/cat/CREDITS.md -Raw
          if ($credits -notmatch '@月薪喵' -or $credits -notmatch 'mfuns.net/article/120254') {
            throw 'GIF attribution is missing or incomplete'
          }
          if (-not (git ls-files "assets/cat/*.gif")) { throw 'No attributed GIF assets are tracked' }
      - run: npm run package:win
      - name: List Windows packages
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: workmeow-windows-x64
          path: |
            dist/WorkMeow-*-Windows-x64.exe
            dist/WorkMeow-*-Windows-x64.exe.blockmap
            dist/WorkMeow-*-Windows-x64.zip
            dist/latest.yml
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: release
          merge-multiple: true
      - name: Verify checksums
        working-directory: release
        run: sha256sum --check SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WorkMeow ${GITHUB_REF_NAME#v}" \
            --generate-notes
