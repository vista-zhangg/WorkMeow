name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Verify tag matches package version
        run: node -e "const v=require('./package.json').version;if('v'+v!==process.env.GITHUB_REF_NAME)throw new Error('tag/package version mismatch')"
      - run: npm ci
      - run: npm test
      - name: Verify GIF attribution and assets
        shell: pwsh
        run: |
          $credits = Get-Content assets/cat/CREDITS.md -Raw
          if ($credits -notmatch '@月薪喵' -or $credits -notmatch 'mfuns.net/article/120254') {
            throw 'GIF attribution is missing or incomplete'
          }
          if (-not (git ls-files "assets/cat/*.gif")) { throw 'No attributed GIF assets are tracked' }
      - run: npm run package:win
      - name: List Windows packages
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: workmeow-windows-x64
          path: |
            dist/WorkMeow-*-Windows-x64.exe
            dist/WorkMeow-*-Windows-x64.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [build-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true
      - name: Generate checksums
        run: |
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "WorkMeow ${GITHUB_REF_NAME#v}" \
            --generate-notes
