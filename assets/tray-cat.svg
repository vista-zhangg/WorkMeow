<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <title>打工喵任务栏图标</title>
  <desc>透明背景的橙色打工喵头像</desc>

  <!-- The canvas is intentionally transparent: Windows supplies the tray color. -->
  <path
    d="M39 108 43 55c1-17 18-25 31-14l22 18c10-4 21-6 32-6s22 2 32 6l22-18c13-11 30-3 31 14l4 53c4 10 6 21 6 33 0 55-45 96-99 96s-99-41-99-96c0-12 2-23 6-33Z"
    fill="#F6A04A"
    stroke="#4A2A23"
    stroke-width="9"
    stroke-linejoin="round"
  />

  <!-- Inner ears keep the silhouette readable at 16–32 px. -->
  <path d="M53 68 56 53c1-7 6-8 11-4l18 13Z" fill="#E57E55" />
  <path d="m203 68-3-15c-1-7-6-8-11-4l-18 13Z" fill="#E57E55" />

  <!-- Friendly eyes with the same simple, high-contrast expression as the pet. -->
  <ellipse cx="91" cy="132" rx="18" ry="25" fill="#211A18" />
  <ellipse cx="165" cy="132" rx="18" ry="25" fill="#211A18" />
  <circle cx="86" cy="123" r="5" fill="#FFFDF8" />
  <circle cx="160" cy="123" r="5" fill="#FFFDF8" />

  <!-- Nose and smile. -->
  <path
    d="M119 158Q128 153 137 158q-3 10-9 13-6-3-9-13Z"
    fill="#F39BA4"
    stroke="#4A2A23"
    stroke-width="4"
    stroke-linejoin="round"
  />
  <path
    d="M128 170c0 10-11 13-16 6m16-6c0 10 11 13 16 6"
    fill="none"
    stroke="#211A18"
    stroke-width="6"
    stroke-linecap="round"
  />

  <!-- Dark under-strokes keep the light whiskers legible on both light and dark trays. -->
  <g fill="none" stroke="#4A2A23" stroke-width="11" stroke-linecap="round">
    <path d="M77 162C57 158 36 153 17 153" />
    <path d="M77 176C55 176 35 178 17 183" />
    <path d="M179 162c20-4 41-9 60-9" />
    <path d="M179 176c22 0 42 2 60 7" />
  </g>
  <g fill="none" stroke="#FFF8EF" stroke-width="6" stroke-linecap="round">
    <path d="M77 162C57 158 36 153 17 153" />
    <path d="M77 176C55 176 35 178 17 183" />
    <path d="M179 162c20-4 41-9 60-9" />
    <path d="M179 176c22 0 42 2 60 7" />
  </g>
</svg>
